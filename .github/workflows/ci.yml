name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Formato
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Vulnerabilidades conocidas (govulncheck)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      # Las reglas y los tests contienen los patrones que se detectan (es su trabajo), por eso se excluyen.
      - name: repoguard se revisa a sí mismo
        run: go run ./cmd/repoguard scan . --exclude "internal/rules/**,*_test.go" --fail-on media
